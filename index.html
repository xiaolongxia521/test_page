<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Page</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { font-size: 1.2rem; opacity: 0.8; margin-bottom: 2rem; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      max-width: 700px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .card h3 { margin-bottom: 0.5rem; }
    .card span { font-size: 2rem; }
    .counter-section {
      margin-top: 2.5rem;
    }
    button {
      background: linear-gradient(90deg, #f5576c, #f093fb);
      border: none;
      color: #fff;
      font-size: 1.1rem;
      padding: 0.7rem 2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: opacity 0.3s;
      margin: 0 0.5rem;
    }
    button:hover { opacity: 0.85; }
    .count {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 1rem 0;
      color: #4facfe;
    }
    .time { margin-top: 2rem; opacity: 0.6; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>Hello, GitHub Pages!</h1>
      <p>这是一个测试页面，由 Vue 3 驱动</p>
      <div class="card-grid">
        <div class="card" v-for="item in items" :key="item.name">
          <span>{{ item.emoji }}</span>
          <h3>{{ item.name }}</h3>
          <p style="font-size:0.85rem;opacity:0.7">{{ item.desc }}</p>
        </div>
      </div>
      <div class="counter-section">
        <p>点一下试试？</p>
        <div class="count">{{ count }}</div>
        <button @click="count++">+1</button>
        <button @click="count = 0">重置</button>
      </div>
      <div class="time">当前时间：{{ currentTime }}</div>
    </div>
  </div>
  <script>
    const { createApp, ref, computed, onMounted, onUnmounted } = Vue
    createApp({
      setup() {
        const count = ref(0)
        const items = ref([
          { emoji: '🚀', name: '快速部署', desc: '推送即上线' },
          { emoji: '🎨', name: 'Vue 3', desc: '渐进式框架' },
          { emoji: '☁️', name: 'GitHub Pages', desc: '免费静态托管' },
        ])
        const now = ref(new Date())
        let timer
        const currentTime = computed(() => now.value.toLocaleString('zh-CN'))
        onMounted(() => { timer = setInterval(() => { now.value = new Date() }, 1000) })
        onUnmounted(() => clearInterval(timer))
        return { count, items, currentTime }
      }
    }).mount('#app')
  </script>
</body>
</html>
